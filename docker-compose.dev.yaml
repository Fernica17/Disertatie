services:
  php-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: erp-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      postgres-service:
        condition: service_healthy
    networks:
      - erp-network

  nginx-service:
    image: nginx:alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-service
    networks:
      - erp-network

  postgres-service:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_AUDIT_DB: ${POSTGRES_AUDIT_DB:-erp_audit}
      POSTGRES_FACE_DB: ${POSTGRES_FACE_DB:-erp_face}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-erp_db}", "-U", "${POSTGRES_USER:-erp}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "5433:5432"
    volumes:
      - erp-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks:
      - erp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    restart: unless-stopped
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      - postgres-service
    networks:
      - erp-network

  mailer:
    image: axllent/mailpit
    container_name: erp-mailer
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - erp-network

  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: erp-messenger
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      postgres-service:
        condition: service_healthy
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    networks:
      - erp-network

  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: erp-face
    restart: unless-stopped
    environment:
      FACE_API_KEY: ${FACE_API_KEY:-dev_face_service_key}
      FACE_DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-secretpassword}@postgres-service:5432/${POSTGRES_FACE_DB:-erp_face}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.45}
    volumes:
      # Source only - the ONNX models stay baked into the image
      - ./face-service/app:/srv/face/app:ro
    ports:
      - "8092:8000"
    depends_on:
      postgres-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - erp-network

  node-service:
    image: node:22
    container_name: erp-node
    restart: unless-stopped
    volumes:
      - .:/var/www/symfony:consistent
    working_dir: /var/www/symfony
    # Watch-mode build (not dev-server): assets are written to public/build and
    # served by nginx from the same origin as the app, which keeps JS errors
    # readable and needs no HMR websocket through Docker.
    command: sh -c "yarn install && yarn encore dev --watch"
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  erp-postgres-data:
