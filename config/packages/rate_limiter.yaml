framework:
    rate_limiter:
        # Face matching is the expensive call and, once wired into login, the one
        # worth brute-forcing. Generous enough for a person retrying a capture,
        # tight enough that a script gains nothing.
        face_identify:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'

        # The face login endpoints are reachable without a session. Detection is
        # a polling loop so it needs headroom; matching is the expensive call and
        # the one an attacker would hammer, so it stays tight.
        face_login_detect:
            policy: 'sliding_window'
            limit: 150
            interval: '1 minute'

        # Recognition fires by itself once a face is stable, with up to three
        # attempts per visit, so the allowance has to cover a few page loads.
        face_login_identify:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'
